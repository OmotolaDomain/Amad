<!doctype html>
<html lang="en" class="booting">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AMAD · Daily Learning for Business Growth</title>
  <meta name="description" content="AMAD is a personalised daily learning and knowledge discovery platform for business growth, strategy, leadership and professional development. Free, open source, no sign-up.">
  <meta name="application-name" content="AMAD">
  <meta name="apple-mobile-web-app-title" content="AMAD">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta property="og:type" content="website">
  <meta property="og:title" content="AMAD · Daily Learning for Business Growth">
  <meta property="og:description" content="A daily, illustrated edition of ideas on strategy, enterprise commercial, territory mapping, performance, account management, executive engagement and branding.">
  <meta property="og:image" content="assets/img/welcome-960.webp">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#EEF0F5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0A0E1F" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/svg+xml" href="assets/amad-mark.svg">
  <link rel="apple-touch-icon" href="assets/amad-mark.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="#/today" aria-label="AMAD home">
      <img class="brand-mark" src="assets/amad-mark.svg" alt="" width="32" height="32">
      <span class="brand-name">AMAD</span>
    </a>
    <nav class="tabs" aria-label="Sections">
      <a href="#/today" data-tab="today">Today</a>
      <a href="#/explore" data-tab="explore">Explore</a>
      <a href="#/fresh" data-tab="fresh">From the web</a>
      <a href="#/saved" data-tab="saved">Library</a>
      <a href="#/plan" data-tab="plan">Progress</a>
    </nav>
    <div class="topbar-right">
      <a class="streak" id="streak" href="#/plan" title="Daily reading streak" data-icon="flame"><b>0</b><span class="sr-only"> day streak</span></a>
      <button class="icon-btn" id="theme-toggle" aria-label="Switch light or dark mode" data-icon="moon"></button>
      <a class="btn small" id="share-idea-link" target="_blank" rel="noopener" data-icon="plus">Share an idea</a>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <footer class="footer">
    <p><b>AMAD</b> is free, open source and needs no sign-up. Your progress stays in this browser.
      <a id="repo-link" target="_blank" rel="noopener">Contribute on GitHub</a>. <a href="#/about">About, sources and photo credits</a>.</p>
  </footer>

  <nav class="bottom-nav" aria-label="Sections">
    <a href="#/today" data-tab="today" data-icon="today">Today</a>
    <a href="#/explore" data-tab="explore" data-icon="explore">Explore</a>
    <a href="#/fresh" data-tab="fresh" data-icon="fresh">Web</a>
    <a href="#/saved" data-tab="saved" data-icon="library">Library</a>
    <a href="#/plan" data-tab="plan" data-icon="progress">Progress</a>
  </nav>

  <div class="overlay reader-overlay" id="reader" role="dialog" aria-modal="true" aria-labelledby="reader-title" hidden></div>
  <div class="overlay ob-overlay" id="onboarding" role="dialog" aria-modal="true" aria-labelledby="ob-title" hidden></div>
  <div class="overlay cel-overlay" id="celebrate" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/art.js" defer></script>
  <script src="assets/visuals.js" defer></script>
  <script src="assets/app.js" defer></script>
</body>
</html>
