name: Font download (tools branch only)
on:
  push:
    branches: [tools/images]
    paths: ["tools/fonts.py"]
permissions:
  contents: write
jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u tools/fonts.py
      - run: |
          git config user.name "amad-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A fonts && git commit -m "Fonts" && git push
