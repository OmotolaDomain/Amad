name: Daily feed refresh

on:
  schedule:
    - cron: "17 5 * * *" # every day, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch public feeds
        run: python scripts/fetch_feeds.py
      - name: Validate
        run: python scripts/validate.py
      - name: Commit if changed
        run: |
          git config user.name "amad-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/feed.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Daily feed refresh $(date -u +%F)"
          git pull --rebase
          git push
