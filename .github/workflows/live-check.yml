name: Live PWA check (tools branch only)
on:
  push:
    branches: [tools/images]
    paths: ["tools/live-check.js", "tools/live-check-trigger.txt"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm init -y >/dev/null && npm install playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: node tools/live-check.js
      - if: always()
        run: |
          git config user.name "amad-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/live-check-result.txt tools/live-*.png 2>/dev/null || true
          git commit -m "Live PWA check results" && git push || echo "nothing to commit"
